<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docker 微服務系統儀表板</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 30px; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 700px; margin: 0 auto 20px auto; }
    h1 { margin-top: 0; color: #1e293b; font-size: 22px; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 13px; }
    .online { background: #dcfce7; color: #15803d; }
    .offline { background: #fee2e2; color: #b91c1c; }
    input[type="text"] { width: 75%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
    button { padding: 8px 16px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    ul { list-style: none; padding: 0; }
    li { background: #f8fafc; border-left: 4px solid #2563eb; margin-bottom: 8px; padding: 8px 12px; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Docker 微服務系統狀態儀表板</h1>
    <p><strong>Nginx:</strong> <span class="status-badge online">Running (Reverse Proxy)</span></p>
    <p><strong>FastAPI Backend:</strong> <span id="backend-status" class="status-badge offline">Checking...</span></p>
    <p><strong>PostgreSQL:</strong> <span id="db-status" class="status-badge offline">Checking...</span></p>
  </div>

  <div class="card">
    <h2>PostgreSQL 讀寫測試</h2>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="log-input" placeholder="輸入留言或測試字串寫入資料庫...">
      <button onclick="sendLog()">送出紀錄</button>
    </div>
    <h3>最新 10 筆資料庫紀錄</h3>
    <ul id="log-list">載入中...</ul>
  </div>

  <script>
    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        const beBadge = document.getElementById('backend-status');
        const dbBadge = document.getElementById('db-status');

        beBadge.innerText = data.service + " " + data.status;
        beBadge.className = "status-badge online";

        dbBadge.innerText = data.database;
        dbBadge.className = data.database === "Connected" ? "status-badge online" : "status-badge offline";
      } catch (err) {
        document.getElementById('backend-status').innerText = "Offline";
        document.getElementById('db-status').innerText = "Offline";
      }
    }

    async function fetchLogs() {
      try {
        const res = await fetch('/api/logs');
        const logs = await res.json();
        const list = document.getElementById('log-list');
        list.innerHTML = logs.length ? '' : '<li>尚無資料</li>';
        logs.forEach(l => {
          const item = document.createElement('li');
          item.innerText = `[${new Date(l.created_at).toLocaleTimeString()}] ${l.message}`;
          list.appendChild(item);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function sendLog() {
      const input = document.getElementById('log-input');
      if (!input.value.trim()) return;
      await fetch('/api/logs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: input.value })
      });
      input.value = '';
      fetchLogs();
    }

    checkHealth();
    fetchLogs();
    setInterval(checkHealth, 5000);
  </script>
</body>
</html>
