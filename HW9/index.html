<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人麻將戰績記帳器</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #10b981;
      --win-color: #10b981;
      --win-bg: rgba(16, 185, 129, 0.15);
      --loss-color: #ef4444;
      --loss-bg: rgba(239, 68, 68, 0.15);
      --input-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      text-align: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      border: 1px solid var(--border-color);
    }

    /* 儀表板 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .dash-item {
      background-color: rgba(15, 23, 42, 0.6);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .dash-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .dash-value {
      font-size: 1.4rem;
      font-weight: bold;
    }

    /* 表單 */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    /* 勝負切換按鈕 */
    .outcome-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .outcome-btn {
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-muted);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .outcome-btn.active-win {
      background-color: var(--win-bg);
      color: var(--win-color);
      border-color: var(--win-color);
    }

    .outcome-btn.active-loss {
      background-color: var(--loss-bg);
      color: var(--loss-color);
      border-color: var(--loss-color);
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    /* 歷史紀錄 */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--loss-color);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem;
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .history-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .history-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .history-detail {
      font-size: 0.95rem;
    }

    .history-amount {
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .delete-item-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
    }

    .delete-item-btn:hover {
      color: var(--loss-color);
    }

    .text-win { color: var(--win-color); }
    .text-loss { color: var(--loss-color); }
    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 1.5rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🀄 個人麻將戰績記帳器</h1>
    </header>

    <!-- 數據總覽 -->
    <div class="card">
      <div class="dashboard-grid">
        <div class="dash-item">
          <div class="dash-label">累計總淨額</div>
          <div id="totalAmount" class="dash-value">$0</div>
        </div>
        <div class="dash-item">
          <div class="dash-label">勝率</div>
          <div id="winRate" class="dash-value">0%</div>
        </div>
        <div class="dash-item">
          <div class="dash-label">總打牌場數</div>
          <div id="totalGames" class="dash-value">0 場</div>
        </div>
        <div class="dash-item">
          <div class="dash-label">累計台數</div>
          <div id="totalTai" class="dash-value">0 台</div>
        </div>
      </div>
    </div>

    <!-- 新增紀錄表單 -->
    <div class="card">
      <form id="recordForm">
        <div class="form-group">
          <label for="date">日期</label>
          <input type="date" id="date" required />
        </div>

        <div class="grid-2 form-group">
          <div>
            <label for="base">底 (元)</label>
            <input type="number" id="base" value="50" min="0" required />
          </div>
          <div>
            <label for="point">台 (元)</label>
            <input type="number" id="point" value="20" min="0" required />
          </div>
        </div>

        <div class="form-group">
          <label>戰果 (輸 / 贏)</label>
          <div class="outcome-toggle">
            <button type="button" id="btnWin" class="outcome-btn active-win" onclick="setOutcome('win')">贏</button>
            <button type="button" id="btnLoss" class="outcome-btn" onclick="setOutcome('loss')">輸</button>
          </div>
        </div>

        <div class="grid-2 form-group">
          <div>
            <label for="tai">總台數</label>
            <input type="number" id="tai" value="0" min="0" required />
          </div>
          <div>
            <label for="amount">最終結算金額 (元)</label>
            <input type="number" id="amount" value="50" required />
          </div>
        </div>

        <button type="submit" class="submit-btn">儲存對局紀錄</button>
      </form>
    </div>

    <!-- 歷史紀錄 -->
    <div class="card">
      <div class="history-header">
        <h3>歷史對局紀錄</h3>
        <button class="clear-btn" onclick="clearAllHistory()">清空所有紀錄</button>
      </div>
      <div id="historyList" class="history-list">
        <!-- 紀錄會動態渲染於此 -->
      </div>
    </div>
  </div>

  <script>
    let currentOutcome = 'win';
    let records = JSON.parse(localStorage.getItem('mahjong_single_records')) || [];

    // 初始化日期為今天
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // 初始化事件監聽
    document.getElementById('base').addEventListener('input', autoCalculateAmount);
    document.getElementById('point').addEventListener('input', autoCalculateAmount);
    document.getElementById('tai').addEventListener('input', autoCalculateAmount);
    document.getElementById('recordForm').addEventListener('submit', handleAddRecord);

    function setOutcome(type) {
      currentOutcome = type;
      const btnWin = document.getElementById('btnWin');
      const btnLoss = document.getElementById('btnLoss');

      if (type === 'win') {
        btnWin.className = 'outcome-btn active-win';
        btnLoss.className = 'outcome-btn';
      } else {
        btnWin.className = 'outcome-btn';
        btnLoss.className = 'outcome-btn active-loss';
      }
      autoCalculateAmount();
    }

    // 自動計算金額 (底 + 台數 * 台)
    function autoCalculateAmount() {
      const base = parseFloat(document.getElementById('base').value) || 0;
      const point = parseFloat(document.getElementById('point').value) || 0;
      const tai = parseFloat(document.getElementById('tai').value) || 0;

      let calc = base + (tai * point);
      if (currentOutcome === 'loss') {
        calc = -Math.abs(calc);
      } else {
        calc = Math.abs(calc);
      }
      document.getElementById('amount').value = calc;
    }

    // 新增紀錄
    function handleAddRecord(e) {
      e.preventDefault();

      const date = document.getElementById('date').value;
      const base = parseFloat(document.getElementById('base').value) || 0;
      const point = parseFloat(document.getElementById('point').value) || 0;
      const tai = parseFloat(document.getElementById('tai').value) || 0;
      const amount = parseFloat(document.getElementById('amount').value) || 0;

      const record = {
        id: Date.now(),
        date,
        base,
        point,
        tai,
        outcome: currentOutcome,
        amount
      };

      records.unshift(record);
      saveAndRender();
    }

    // 刪除單筆紀錄
    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      saveAndRender();
    }

    // 清空所有紀錄
    function clearAllHistory() {
      if (records.length === 0) return;
      if (confirm('確定要清空所有歷史紀錄嗎？')) {
        records = [];
        saveAndRender();
      }
    }

    // 儲存並渲染
    function saveAndRender() {
      localStorage.setItem('mahjong_single_records', JSON.stringify(records));
      renderDashboard();
      renderHistory();
    }

    // 渲染儀表板
    function renderDashboard() {
      const totalGames = records.length;
      let totalAmount = 0;
      let totalTai = 0;
      let winCount = 0;

      records.forEach(r => {
        totalAmount += r.amount;
        totalTai += (r.outcome === 'win' ? r.tai : -r.tai);
        if (r.amount > 0) winCount++;
      });

      const winRate = totalGames > 0 ? Math.round((winCount / totalGames) * 100) : 0;

      const totalAmountEl = document.getElementById('totalAmount');
      totalAmountEl.innerText = `${totalAmount >= 0 ? '+' : ''}$${totalAmount}`;
      totalAmountEl.className = `dash-value ${totalAmount >= 0 ? 'text-win' : 'text-loss'}`;

      document.getElementById('winRate').innerText = `${winRate}%`;
      document.getElementById('totalGames').innerText = `${totalGames} 場`;
      document.getElementById('totalTai').innerText = `${totalTai} 台`;
    }

    // 渲染歷史列表
    function renderHistory() {
      const listEl = document.getElementById('historyList');
      if (records.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">尚無歷史對局紀錄</div>';
        return;
      }

      listEl.innerHTML = records.map(r => {
        const isWin = r.amount >= 0;
        const sign = isWin ? '+' : '';
        const colorClass = isWin ? 'text-win' : 'text-loss';

        return `
          <div class="history-item">
            <div class="history-info">
              <div class="history-date">${r.date}</div>
              <div class="history-detail">${r.base}/${r.point} 元 · ${r.tai} 台</div>
            </div>
            <div class="history-amount ${colorClass}">
              ${sign}$${r.amount}
              <button class="delete-item-btn" onclick="deleteRecord(${r.id})" title="刪除">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 初始渲染
    autoCalculateAmount();
    saveAndRender();
  </script>
</body>
</html>
